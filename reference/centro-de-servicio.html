    : `<div style="display:flex;gap:6px;">
        <button class="icon-btn" title="${t('editMinuta')}" onclick="startEditLlamamiento(${i})">✏️</button>
        <button class="icon-btn" title="${t('deleteMinuta')}" onclick="deleteLlamamiento(${i})" style="color:var(--rojo);">🗑️</button>
      </div>`;
  return `<div class="list-row" style="${x.deleted?'opacity:.55;':''}"><div class="row-top">
    <div style="min-width:0;flex:1;">
      <div class="who" style="${x.deleted?'text-decoration:line-through;':''}">${x.persona}</div>
      <div class="what">${x.llamamiento}</div>
      ${metaBits.length ? `<div class="meta-line">${metaBits.join(' · ')}</div>` : ''}
      ${changesPanel}
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
      ${x.deleted?'':`<span class="badge ${x.estado}" onclick="cycleLlamamientoEstado(${i})">${t('est'+x.estado.charAt(0).toUpperCase()+x.estado.slice(1))}</span>`}
      ${actionBtns}
    </div>
  </div></div>`;
}
function renderLlamamientos(){
  const allEntries = state.llamamientos.map((x,i)=>({x,i})).reverse();
  const activeRows = allEntries.filter(({x})=>!x.deleted).map(({x,i})=>renderLlamamientoRow(x,i)).join('');
  const trashRows = allEntries.filter(({x})=>x.deleted).map(({x,i})=>renderLlamamientoRow(x,i)).join('');
  const deletedCount = state.llamamientos.filter(x=>x.deleted).length;
  const trashCard = showLlamamientosTrash ? `<div class="card">
    <h2 style="font-size:.9rem;">🗑️ ${t('trash')}</h2>${trashRows || `<div class="empty">${t('noTrash')}</div>`}
  </div>` : '';
  return `<div class="card">
    <div class="card-header-row">
      <div><h2>${t('llamamientosTitle')}</h2><div class="card-sub">${t('llamamientosSub')}</div></div>
      <button class="icon-btn" title="${t('trash')}" onclick="toggleLlamamientosTrash()" style="position:relative;${showLlamamientosTrash?'background:var(--linen);':''}">
        🗑️${deletedCount>0 ? `<span style="position:absolute;top:-6px;right:-6px;background:var(--rojo);color:white;border-radius:10px;font-size:.6rem;font-weight:700;padding:1px 5px;line-height:1.3;">${deletedCount}</span>` : ''}
      </button>
    </div>
    <div class="privacy-note"><b>${state.lang==='es'?'Privacidad:':'Privacy:'}</b> ${t('llamamientosWarning')}</div>
    ${activeRows || `<div class="empty">${t('noLlamamientos')}</div>`}
    <div class="field-row">
      <div class="field"><input id="llPersona" placeholder="${t('personaPh')}"></div>
      <div class="field"><input id="llLlamamiento" placeholder="${t('llamamientoPh')}"></div>
    </div>
    <button class="btn-full" onclick="addLlamamiento()">${t('addLlamamiento')}</button>
  </div>
  ${trashCard}`;
}
function addLlamamiento(){
  const p=document.getElementById('llPersona'), l=document.getElementById('llLlamamiento');
  if(p.value.trim() && l.value.trim()){
    state.llamamientos.push({
      persona:p.value.trim(), llamamiento:l.value.trim(), estado:'orando',
      createdAt:new Date().toISOString(), history:[], editedAt:null, deleted:false, deletedAt:null
    });
    p.value=''; l.value=''; saveState(); render(); toast(t('llamamientoAdded'));
  }
}
function startEditLlamamiento(i){ editingLlamamientoIndex=i; render(); }
function cancelEditLlamamiento(){ editingLlamamientoIndex=null; render(); }
function saveEditLlamamiento(i){
  const persona = document.getElementById('editLlPersona').value.trim();
  const llamamiento = document.getElementById('editLlLlamamiento').value.trim();
  if(!persona || !llamamiento) return;
  const x = state.llamamientos[i];
  if(!x.history) x.history=[];
  x.history.push({ persona:x.persona, llamamiento:x.llamamiento, at: x.editedAt || x.createdAt });
  x.persona=persona; x.llamamiento=llamamiento; x.editedAt=new Date().toISOString();
  editingLlamamientoIndex=null; saveState(); render(); toast(t('saved'));
}
function deleteLlamamiento(i){
  state.llamamientos[i].deleted=true; state.llamamientos[i].deletedAt=new Date().toISOString();
  saveState(); render(); toast(t('movedToTrash'));
}
function restoreLlamamiento(i){
  state.llamamientos[i].deleted=false; state.llamamientos[i].deletedAt=null;
  saveState(); render(); toast(t('restored'));
}

/* ---- Rotaciones (asignaciones recurrentes) ---- */
let editingRotacionIndex = null;
let openRotacionHistoryIndices = new Set();
let openTurnHistoryIndices = new Set();
let showRotacionesTrash = false;
function toggleRotacionHistoryView(i){
  if(openRotacionHistoryIndices.has(i)) openRotacionHistoryIndices.delete(i); else openRotacionHistoryIndices.add(i);
  render();
}
function toggleTurnHistoryView(i){
  if(openTurnHistoryIndices.has(i)) openTurnHistoryIndices.delete(i); else openTurnHistoryIndices.add(i);
  render();
}
function toggleRotacionesTrash(){ showRotacionesTrash = !showRotacionesTrash; render(); }
function avanzarTurno(i){
  const r = state.rotaciones[i];
  if(r.deleted || !r.personas.length) return;
  if(!r.turnHistory) r.turnHistory=[];
  r.turnHistory.push({ persona: r.personas[r.turnoActual], fecha: new Date().toISOString() });
  r.turnoActual = (r.turnoActual+1) % r.personas.length;
  saveState(); render(); toast(t('turnAdvanced'));
}
function renderRotacionRow(r, i){
  if(editingRotacionIndex === i){
    return `<div class="list-row">
      <div class="field-row" style="margin-top:0;">
        <div class="field"><input id="editRotTarea" value="${(r.tarea||'').replace(/"/g,'&quot;')}" placeholder="${t('tareaRotPh')}"></div>
        <div class="field"><input id="editRotPersonas" value="${(r.personas||[]).join(', ').replace(/"/g,'&quot;')}" placeholder="${t('personasRotPh')}"></div>
      </div>
      <div class="share-row" style="margin-top:8px;">
        <button class="share-btn" style="background:var(--living-teal);flex:0 0 auto;padding:8px 14px;font-size:.74rem;" onclick="saveEditRotacion(${i})">${t('saveEdit')}</button>
        <button class="share-btn" style="background:#9c8f6c;flex:0 0 auto;padding:8px 14px;font-size:.74rem;" onclick="cancelEditRotacion()">${t('cancelEdit')}</button>
      </div>
    </div>`;
  }
  const changesN = (r.history||[]).length;
  const changesOpen = openRotacionHistoryIndices.has(i);
  const turnN = (r.turnHistory||[]).length;
  const turnOpen = openTurnHistoryIndices.has(i);
  const metaBits = [];
  if(r.createdAt) metaBits.push(`${t('createdOn')} ${fmtDate(r.createdAt)}`);
  if(r.editedAt) metaBits.push(`${t('editedOn')} ${fmtDate(r.editedAt)}`);
  if(r.deleted) metaBits.push(`<b style="color:var(--rojo);">${t('deletedOn')} ${fmtDate(r.deletedAt)}</b>`);
  if(changesN>0) metaBits.push(`<span class="link" onclick="toggleRotacionHistoryView(${i})">${t('viewChanges')} (${changesN})</span>`);
  if(!r.deleted) metaBits.push(`<span class="link" onclick="toggleTurnHistoryView(${i})">${t('viewTurnHistory')} (${turnN})</span>`);
  const changesPanel = (changesOpen && changesN>0) ? `
    <div style="margin-top:6px;">
      ${r.history.slice().reverse().map(v=>`
        <div style="border-top:1px dashed var(--line);padding:6px 0;font-size:.78rem;">
          <div style="font-size:.65rem;color:#a89e7f;margin-bottom:2px;">${t('versionOf')} ${fmtDate(v.at)}</div>
          <div style="color:#7a6f52;"><b>${v.tarea}</b>: ${(v.personas||[]).join(', ')}</div>
        </div>`).join('')}
    </div>` : '';
  const turnPanel = (turnOpen) ? `
    <div style="margin-top:6px;">
      ${turnN>0 ? r.turnHistory.slice().reverse().map(v=>`
        <div style="border-top:1px dashed var(--line);padding:6px 0;font-size:.78rem;color:#7a6f52;">
          ${fmtDate(v.fecha)} — <b>${v.persona}</b>
        </div>`).join('') : `<div style="font-size:.76rem;color:#a89e7f;font-style:italic;padding:6px 0;">${t('noTurnHistory')}</div>`}
    </div>` : '';
  const actionBtns = r.deleted
    ? `<button class="icon-btn" title="${t('restoreMinuta')}" onclick="restoreRotacion(${i})">↺</button>`
    : `<div style="display:flex;gap:6px;">
        <button class="icon-btn" title="${t('editMinuta')}" onclick="startEditRotacion(${i})">✏️</button>
        <button class="icon-btn" title="${t('deleteMinuta')}" onclick="deleteRotacion(${i})" style="color:var(--rojo);">🗑️</button>
      </div>`;
  const actual = r.personas && r.personas.length ? r.personas[r.turnoActual] : '—';
  return `<div class="list-row" style="${r.deleted?'opacity:.55;':''}"><div class="row-top">
    <div style="min-width:0;flex:1;">
      <div class="who" style="${r.deleted?'text-decoration:line-through;':''}">${r.tarea}</div>
      <div class="what">${t('turnoActualLabel')} <b>${actual}</b></div>
      <div class="what" style="color:#a89e7f;font-size:.76rem;">${t('ordenLabel')} ${(r.personas||[]).join(', ')}</div>
      ${metaBits.length ? `<div class="meta-line">${metaBits.join(' · ')}</div>` : ''}
      ${changesPanel}${turnPanel}
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
      ${r.deleted?'':`<button class="mark-btn" onclick="avanzarTurno(${i})">↻ ${t('avanzarTurno')}</button>`}
      ${actionBtns}
    </div>
  </div></div>`;
}
function renderRotaciones(){
  const allEntries = state.rotaciones.map((r,i)=>({r,i})).reverse();
  const activeRows = allEntries.filter(({r})=>!r.deleted).map(({r,i})=>renderRotacionRow(r,i)).join('');
  const trashRows = allEntries.filter(({r})=>r.deleted).map(({r,i})=>renderRotacionRow(r,i)).join('');
  const deletedCount = state.rotaciones.filter(r=>r.deleted).length;
  const trashCard = showRotacionesTrash ? `<div class="card">
    <h2 style="font-size:.9rem;">🗑️ ${t('trash')}</h2>${trashRows || `<div class="empty">${t('noTrash')}</div>`}
  </div>` : '';
  return `<div class="card">
    <div class="card-header-row">
      <div><h2>${t('rotacionesTitle')}</h2><div class="card-sub">${t('rotacionesSub')}</div></div>
      <button class="icon-btn" title="${t('trash')}" onclick="toggleRotacionesTrash()" style="position:relative;${showRotacionesTrash?'background:var(--linen);':''}">
        🗑️${deletedCount>0 ? `<span style="position:absolute;top:-6px;right:-6px;background:var(--rojo);color:white;border-radius:10px;font-size:.6rem;font-weight:700;padding:1px 5px;line-height:1.3;">${deletedCount}</span>` : ''}
      </button>
    </div>
    ${activeRows || `<div class="empty">${t('noRotaciones')}</div>`}
    <div class="field-row">
      <div class="field"><input id="rotTarea" placeholder="${t('tareaRotPh')}"></div>
      <div class="field"><input id="rotPersonas" placeholder="${t('personasRotPh')}"></div>
    </div>
    <button class="btn-full" onclick="addRotacion()">${t('addRotacion')}</button>
  </div>
  ${trashCard}`;
}
function addRotacion(){
  const tEl=document.getElementById('rotTarea'), pEl=document.getElementById('rotPersonas');
  const personas = pEl.value.split(',').map(s=>s.trim()).filter(Boolean);
  if(tEl.value.trim() && personas.length){
    state.rotaciones.push({
      tarea:tEl.value.trim(), personas, turnoActual:0, turnHistory:[],
      createdAt:new Date().toISOString(), history:[], editedAt:null, deleted:false, deletedAt:null
    });
    tEl.value=''; pEl.value=''; saveState(); render(); toast(t('rotacionAdded'));
  }
}
function startEditRotacion(i){ editingRotacionIndex=i; render(); }
function cancelEditRotacion(){ editingRotacionIndex=null; render(); }
function saveEditRotacion(i){
  const tarea = document.getElementById('editRotTarea').value.trim();
  const personas = document.getElementById('editRotPersonas').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!tarea || !personas.length) return;
  const r = state.rotaciones[i];
  if(!r.history) r.history=[];
  r.history.push({ tarea:r.tarea, personas:r.personas, at: r.editedAt || r.createdAt });
  r.tarea=tarea; r.personas=personas;
  if(r.turnoActual >= personas.length) r.turnoActual = 0;
  r.editedAt=new Date().toISOString();
  editingRotacionIndex=null; saveState(); render(); toast(t('saved'));
}
function deleteRotacion(i){
  state.rotaciones[i].deleted=true; state.rotaciones[i].deletedAt=new Date().toISOString();
  saveState(); render(); toast(t('movedToTrash'));
}
function restoreRotacion(i){
  state.rotaciones[i].deleted=false; state.rotaciones[i].deletedAt=null;
  saveState(); render(); toast(t('restored'));
}

/* ---- Hoy (dashboard) ---- */
const DAY_NAMES = {
  es:['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],
  en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
};
function statCard(num, label, cls, tab){
  return `<div class="stat-card ${cls}" onclick="setTab('${tab}')">
    <div class="num">${num}</div><div class="label">${label}</div>
  </div>`;
}
function feedItem(icon, textHtml, subText, tab){
  return `<div class="feed-item" onclick="setTab('${tab}')">
    <div class="feed-icon">${icon}</div>
    <div class="feed-text">${textHtml}${subText?`<div class="feed-sub">${subText}</div>`:''}</div>
  </div>`;
}
function renderHoy(){
  if(state.roles.length===0){
    return `<div class="dash-hero"><div class="date">—</div><h2>${t('hoyTitle')}</h2><div class="sub">${t('hoyNoRole')}</div></div>`;
  }
  const now = new Date();
  const dayName = DAY_NAMES[state.lang][now.getDay()];
  const dateLabel = now.toLocaleDateString(state.lang==='es'?'es-ES':'en-US', {day:'numeric', month:'long'});

  const pendingTasks = state.tareas.filter(x=>!x.deleted && !x.done);
  const attnMin = state.roles.includes('cuorum_sds') ? getAllActiveFamilies().filter(f=>{ const d=daysSince(f.lastContact); return d===null||d>30; }) : [];
  const activeEnt = state.roles.includes('ejecutivo') ? state.entrevistas.filter(x=>!x.deleted && x.estado!=='hecha') : [];
  const clasesSinMaestro = state.roles.includes('ed') ? state.clases.filter(c=>!c.deleted && !(c.maestro && c.maestro.trim())) : [];
  const activeLlam = state.llamamientos.filter(x=>!x.deleted);
  const activeRot = state.rotaciones.filter(r=>!r.deleted);
  const nowM = new Date();
  const minutasMonth = state.minutas.filter(m=>!m.deleted && new Date(m.date).getMonth()===nowM.getMonth() && new Date(m.date).getFullYear()===nowM.getFullYear()).length;

  const totalUrgent = pendingTasks.length + attnMin.length + activeEnt.length + clasesSinMaestro.length;

  const hero = `<div class="dash-hero">
    <div class="date">${dayName}, ${dateLabel}</div>
    <h2>${t('hoyTitle')}</h2>
    <div class="sub">${totalUrgent>0
      ? (state.lang==='es' ? `${totalUrgent} cosas requieren tu atención` : `${totalUrgent} things need your attention`)
      : (state.lang==='es' ? 'Todo al día 🎉' : 'All caught up 🎉')}</div>
  </div>`;

  const statCards = [];
  statCards.push(statCard(pendingTasks.length, t('statAsign'), pendingTasks.length>0?'warn':'ok', 'tareas'));
  if(state.roles.includes('cuorum_sds')) statCards.push(statCard(attnMin.length, t('statAlert'), attnMin.length>0?'warn':'ok', 'ministracion'));
  if(state.roles.includes('ejecutivo')) statCards.push(statCard(activeEnt.length, t('tabEntrevistas'), activeEnt.length>0?'warn':'ok', 'entrevistas'));
  if(state.roles.includes('ed')) statCards.push(statCard(clasesSinMaestro.length, t('sinMaestro'), clasesSinMaestro.length>0?'warn':'ok', 'clases'));
  statCards.push(statCard(activeLlam.length, t('tabLlamamientos'), '', 'llamamientos'));
  statCards.push(statCard(minutasMonth, t('statMin'), '', 'minutas'));
  const statGrid = `<div class="stat-grid">${statCards.join('')}</div>`;

  const sections = [];
  if(pendingTasks.length) sections.push({title:t('tareasTitle'), items:pendingTasks.slice(0,5).map(x=>feedItem('📌', `<b>${x.who}</b>: ${x.what}`, '', 'tareas'))});
  if(attnMin.length) sections.push({title:t('minTitle'), items:attnMin.slice(0,5).map(f=>feedItem('🧭', `<b>${f.compNames}</b> → ${f.family}`, '', 'ministracion'))});
  if(activeEnt.length) sections.push({title:t('tabEntrevistas'), items:activeEnt.slice(0,5).map(x=>feedItem('🗓️', `<b>${x.nombre}</b> — ${x.motivo}`, x.fecha?fmtDateOnly(x.fecha):'', 'entrevistas'))});
  if(clasesSinMaestro.length) sections.push({title:t('tabClases'), items:clasesSinMaestro.slice(0,5).map(c=>feedItem('📚', `<b>${c.clase}</b> — ${t('sinMaestro')}`, '', 'clases'))});

  let feedCard;
  if(sections.length){
    feedCard = `<div class="card">
      ${sections.map(s=>`<div class="feed-section-title">${s.title}</div>${s.items.join('')}`).join('')}
    </div>`;
  } else {
    feedCard = `<div class="card"><div class="all-clear">
      <div class="big-icon">✅</div>
      <div class="msg">${state.lang==='es'?'Todo al día':'All caught up'}</div>
      <div class="sub">${state.lang==='es'?'No hay nada urgente pendiente ahora mismo.':'Nothing urgent pending right now.'}</div>
    </div></div>`;
  }

  const doneItems = state.agenda.filter(it=>it.done).length;
  const totalItems = state.agenda.length;
  const pct = totalItems ? Math.round((doneItems/totalItems)*100) : 0;
  const agendaCard = `<div class="card">
    <div class="card-header-row">
      <div><h2 style="font-size:.95rem;">${t('agendaTitle')}</h2>
      <div class="card-sub" style="margin-bottom:0;">${state.agendaMeta.date?fmtDateOnly(state.agendaMeta.date):''}${state.agendaMeta.time?' · '+state.agendaMeta.time:''}</div></div>
      <button class="view-toggle-btn" onclick="setTab('agenda')">${t('goTo')}</button>
    </div>
    ${totalItems ? `
      <div style="font-size:.8rem;color:#7a6f52;margin-top:8px;">${doneItems}/${totalItems} ${t('hoyAgendaLine')} · ${pct}%</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    ` : `<div class="empty" style="padding:6px 0 0;">${t('hoyNoAgenda')}</div>`}
  </div>`;

  let rotCard = '';
  if(activeRot.length){
    rotCard = `<div class="card">
      <h2 style="font-size:.95rem;">${t('rotacionesTitle')}</h2>
      <div class="chip-row">${activeRot.map(r=>`<div class="chip" onclick="setTab('rotaciones')" style="cursor:pointer;"><b>${r.tarea}:</b> ${r.personas[r.turnoActual]||'—'}</div>`).join('')}</div>
    </div>`;
  }

  let consejoCard = '';
  if(state.roles.includes('obispado')){
    const last = state.consejo.history.length ? state.consejo.history[state.consejo.history.length-1] : null;
    consejoCard = `<div class="card">
      <div class="card-header-row">
        <div><h2 style="font-size:.95rem;">${t('consejoTitle')}</h2></div>
        <button class="view-toggle-btn" onclick="setTab('consejo')">${t('goTo')}</button>
      </div>
      ${last
        ? `<div style="font-size:.85rem;margin-top:6px;">${fmtDateOnly(last.date)} — ${last.items.filter(it=>it.done).length}/${last.items.length} ${t('presentesOf')}</div>`
        : `<div class="empty" style="padding:6px 0 0;">${t('hoyConsejoEmpty')}</div>`}
    </div>`;
  }

  return hero + statGrid + feedCard + agendaCard + rotCard + consejoCard;
}

/* ---- Reporte ---- */
function renderReporte(){
  const now = new Date();
  const inMonth = d => new Date(d).getMonth()===now.getMonth() && new Date(d).getFullYear()===now.getFullYear();
  const activeTareas = state.tareas.filter(x=>!x.deleted);
  const activeMinFamilies = getAllActiveFamilies();
  const done = activeTareas.filter(x=>x.done), pending = activeTareas.filter(x=>!x.done);
  const attn = activeMinFamilies.filter(f=>{ const d=daysSince(f.lastContact); return d===null||d>30; });
  const minutasMonth = state.minutas.filter(m=>!m.deleted && inMonth(m.date));
  const lines = [
    `${t('reportHeader')} — ${now.toLocaleDateString(state.lang==='es'?'es-ES':'en-US',{month:'long',year:'numeric'})}`, '',
    `${t('reportMinutas')} ${minutasMonth.length}`, '',
    `${t('reportTasksDone')} ${done.length?'':'—'}`, ...done.map(x=>`  \u2713 ${x.who}: ${x.what}`), '',
    `${t('reportTasksPending')} ${pending.length?'':'—'}`, ...pending.map(x=>`  · ${x.who}: ${x.what}`), ''
  ];
  if(activeMinFamilies.length){
    lines.push(`${t('reportMinAttn')} ${attn.length?'':'—'}`, ...attn.map(f=>`  ! ${f.compNames} \u2192 ${f.family}`), '');
  }
  const activeEnt = state.entrevistas.filter(x=>!x.deleted && x.estado!=='hecha');
  if(state.entrevistas.some(x=>!x.deleted)){
    lines.push(`${t('reportEntrevistas')} ${activeEnt.length?'':'—'}`,
      ...activeEnt.map(x=>`  · ${x.nombre} — ${x.motivo}${x.fecha?' ('+fmtDateOnly(x.fecha)+')':''}`), '');
  }
  const clasesSinMaestro = state.clases.filter(c=>!c.deleted && !(c.maestro && c.maestro.trim()));
  if(state.clases.some(c=>!c.deleted)){
    lines.push(`${t('reportClasesSinMaestro')} ${clasesSinMaestro.length?'':'—'}`,
      ...clasesSinMaestro.map(c=>`  · ${c.clase}`), '');
  }
  if(state.consejo && state.consejo.history.length){
    const last = state.consejo.history[state.consejo.history.length-1];
    const presentCount = last.items.filter(it=>it.done).length;
    lines.push(`${t('reportConsejo')} ${fmtDateOnly(last.date)} — ${presentCount}/${last.items.length} ${t('presentesOf')}`, '');
  }
  const activeRot = state.rotaciones.filter(r=>!r.deleted);
  if(activeRot.length){
    lines.push(`${t('reportRotaciones')}`,
      ...activeRot.map(r=>`  · ${r.tarea}: ${r.personas[r.turnoActual]||'—'}`), '');
  }
  const text = lines.join('\n');
  return `<div class="card">
    <h2>${t('reportTitle')}</h2><div class="card-sub">${t('reportSub')}</div>
    <div class="report-box" id="reportBox">${text}</div>
    <button class="copy-btn" onclick="copyReport()">${t('copyReport')}</button>
  </div>`;
}
function copyReport(){
  navigator.clipboard.writeText(document.getElementById('reportBox').innerText).then(()=>toast(t('copied')));
}

const PANELS = {
  hoy:renderHoy,
  agenda:renderAgenda, minutas:renderMinutas, tareas:renderTareas,
  llamamientos:renderLlamamientos, rotaciones:renderRotaciones,
  ministracion:renderMinistracion, entrevistas:renderEntrevistas, consejo:renderConsejo, clases:renderClases,
  reporte:renderReporte
};
const TAB_LABELS = {
  hoy:'tabHoy',
  agenda:'tabAgenda', minutas:'tabMinutas', tareas:'tabTareas',
  llamamientos:'tabLlamamientos', rotaciones:'tabRotaciones',
  ministracion:'tabMin', entrevistas:'tabEntrevistas', consejo:'tabConsejo', clases:'tabClases',
  reporte:'tabReporte'
};
function activeTabs(){
  const specific = state.roles.map(r=>ROLES[r] && ROLES[r].tab).filter(Boolean);
  const uniqueSpecific = [...new Set(specific)];
  return ['hoy','agenda','minutas','tareas','llamamientos','rotaciones', ...uniqueSpecific, 'reporte'];
}
function setTab(name){ currentTab=name; render(); }

function render(){
  document.getElementById('appTitle').textContent = t('title');
  document.getElementById('appSub').textContent = state.roles.length
    ? state.roles.map(r=>t('role_'+r)).join(' · ')
    : t('subNoRole');
  document.getElementById('btnLang').textContent = state.lang==='es' ? 'EN' : 'ES';
  document.getElementById('privacyNote').innerHTML = `<b>${state.lang==='es'?'Privacidad:':'Privacy:'}</b> ${t('privacy')}`;
  document.getElementById('footerNote').textContent = t('footNote');

  const pending = state.tareas.filter(x=>!x.deleted && !x.done).length;
  const attn = getAllActiveFamilies().filter(f=>{ const d=daysSince(f.lastContact); return d===null||d>30; }).length;
  const now = new Date();
  const minutasMonth = state.minutas.filter(m=>!m.deleted && new Date(m.date).getMonth()===now.getMonth() && new Date(m.date).getFullYear()===now.getFullYear()).length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-pill"><b>${pending}</b> ${t('statAsign')}</div>
    <div class="stat-pill"><b>${minutasMonth}</b> ${t('statMin')}</div>
    ${attn>0 ? `<div class="stat-pill alert"><b>${attn}</b> ${t('statAlert')}</div>` : ''}
  `;

  const tabs = activeTabs();
  if(!tabs.includes(currentTab)) currentTab = 'hoy';
  document.getElementById('tabs').innerHTML = tabs.map(name=>
    `<button class="view-toggle-btn ${currentTab===name?'active':''}" onclick="setTab('${name}')">${t(TAB_LABELS[name])}</button>`
  ).join('');

  document.getElementById('panelHost').innerHTML = PANELS[currentTab]();
}



function mountInternal(){
document.getElementById('btnRoles').addEventListener('click', openRoleModal);
document.getElementById('btnLang').addEventListener('click', toggleLang);
loadState();
}

return { mount: function(container){ container.innerHTML = SECRETARIO_BODY_HTML; mountInternal(); } };
})();


/* ---- Shell logic ---- */
const SETTINGS_KEY = 'shared-settings';
let sharedSettings = { unidad:'barrio', nombreUnidad:'', estacaDistrito:'', mision:'', obispoPresidente:'', liderMisional:'' };

async function loadSharedSettings(){
  try{ const r = await window.storage.get(SETTINGS_KEY, false); if(r) sharedSettings = JSON.parse(r.value); }
  catch(e){ /* sin ajustes guardados aún */ }
}
async function saveSharedSettings(){
  try{ await window.storage.set(SETTINGS_KEY, JSON.stringify(sharedSettings), false); }
  catch(e){ console.error('Error guardando ajustes', e); }
}

function renderInicio(){
  const host = document.getElementById('moduleHost');
  const unidadLabel = sharedSettings.nombreUnidad
    ? `${sharedSettings.unidad==='barrio'?'Barrio':'Rama'} ${sharedSettings.nombreUnidad}`
    : 'Configura tu unidad en Ajustes';
  host.innerHTML = `
    <div class="hub-wrap">
      <div class="dash-hero">
        <div class="date">${unidadLabel}</div>
        <h2>Centro de Servicio</h2>
        <div class="sub">Todas tus herramientas de llamamiento, en un solo lugar.</div>
      </div>
      <div class="hub-card" onclick="switchModule('secretario')">
        <div class="hub-icon">📋</div>
        <div><div class="hub-title">Cuaderno del Secretario</div>
        <div class="hub-desc">Agenda, minutas, asignaciones, ministración, entrevistas y más.</div></div>
      </div>
      <div class="hub-card disabled" onclick="switchModule('gather')">
        <div class="hub-icon">🧭</div>
        <div><div class="hub-title">Gather</div>
        <div class="hub-desc">Seguimiento de personas en enseñanza — líder misional.</div>
        <span class="hub-tag">Falta integrar</span></div>
      </div>
      <div class="hub-card disabled" onclick="switchModule('bautizapp')">
        <div class="hub-icon">💧</div>
        <div><div class="hub-title">BautizApp</div>
        <div class="hub-desc">Generador de programas e invitaciones de bautismo.</div>
        <span class="hub-tag">Falta integrar</span></div>
      </div>
    </div>`;
}

function renderAjustes(){
  const host = document.getElementById('moduleHost');
  const s = sharedSettings;
  host.innerHTML = `
    <div class="hub-wrap">
      <div class="card">
        <h2>Ajustes compartidos</h2>
        <div class="card-sub">Esta información la usarán todas las herramientas del Centro de Servicio.</div>
        <div class="field-row">
          <div class="field"><label>Tipo de unidad</label>
            <select id="setUnidad" style="width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--line);background:var(--linen);font-family:'Karla',sans-serif;font-size:.85rem;">
              <option value="barrio" ${s.unidad==='barrio'?'selected':''}>Barrio</option>
              <option value="rama" ${s.unidad==='rama'?'selected':''}>Rama</option>
            </select>
          </div>
          <div class="field"><label>Nombre</label><input id="setNombreUnidad" value="${(s.nombreUnidad||'').replace(/"/g,'&quot;')}" placeholder="Sexto"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Estaca / Distrito</label><input id="setEstaca" value="${(s.estacaDistrito||'').replace(/"/g,'&quot;')}" placeholder="San Francisco California"></div>
          <div class="field"><label>Misión</label><input id="setMision" value="${(s.mision||'').replace(/"/g,'&quot;')}" placeholder="Opcional"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Obispo / Presidente</label><input id="setObispo" value="${(s.obispoPresidente||'').replace(/"/g,'&quot;')}"></div>
          <div class="field"><label>Líder misional</label><input id="setLider" value="${(s.liderMisional||'').replace(/"/g,'&quot;')}"></div>
        </div>
        <button class="btn-full" onclick="saveAjustesForm()">Guardar ajustes</button>
      </div>
    </div>`;
}
function saveAjustesForm(){
  sharedSettings.unidad = document.getElementById('setUnidad').value;
  sharedSettings.nombreUnidad = document.getElementById('setNombreUnidad').value.trim();
  sharedSettings.estacaDistrito = document.getElementById('setEstaca').value.trim();
  sharedSettings.mision = document.getElementById('setMision').value.trim();
  sharedSettings.obispoPresidente = document.getElementById('setObispo').value.trim();
  sharedSettings.liderMisional = document.getElementById('setLider').value.trim();
  saveSharedSettings();
  switchModule('inicio');
}

function renderPlaceholder(name, desc){
  document.getElementById('moduleHost').innerHTML = `
    <div class="hub-wrap">
      <div class="card">
        <h2>${name}</h2>
        <div class="card-sub">${desc}</div>
        <div class="upload-box">Sube aquí el archivo .html de ${name} en el chat y lo integro como módulo completo, igual que se hizo con el Cuaderno del Secretario.</div>
      </div>
    </div>`;
}

function switchModule(name){
  document.querySelectorAll('.shell-tab').forEach(b=>b.classList.toggle('active', b.dataset.mod===name));
  const host = document.getElementById('moduleHost');
  host.innerHTML = '';
  if(name==='inicio') renderInicio();
  else if(name==='secretario') SecretarioModule.mount(host);
  else if(name==='gather') renderPlaceholder('Gather', 'Seguimiento de personas en enseñanza para tu llamamiento de líder misional.');
  else if(name==='bautizapp') renderPlaceholder('BautizApp', 'Generador de programas e invitaciones de bautismo.');
  else if(name==='ajustes') renderAjustes();
}
document.querySelectorAll('.shell-tab').forEach(b=>b.addEventListener('click', ()=>switchModule(b.dataset.mod)));
loadSharedSettings().then(()=>switchModule('inicio'));
</script>
</body>
