  .header-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; position:relative; z-index:1;}
  .app-header h1{margin:0;font-size:1.6rem;letter-spacing:.01em;font-weight:600;}
  .app-header .sub{
    font-family:'Karla',Arial,sans-serif;font-size:.72rem;color:var(--dawn-coral-dim);
    margin-top:3px;letter-spacing:.03em;text-transform:uppercase;
  }
  .header-actions{display:flex;gap:6px;flex-shrink:0;}
  .ctrl-teal{
    background:rgba(47,143,146,0.24); border:1px solid rgba(220,234,232,0.38); color:var(--linen);
  }
  .ctrl-teal:hover{ background:rgba(47,143,146,0.36); border-color:rgba(220,234,232,0.58); }
  .icon-btn{
    border-radius:8px; width:36px; height:36px; font-size:1.02rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .icon-btn-badge{
    position:absolute; top:-5px; right:-5px; background:var(--dawn-coral); color:white;
    font-family:'Karla',Arial,sans-serif; font-size:.62rem; font-weight:700; border-radius:20px;
    min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .lang-btn{
    border-radius:8px; padding:0 10px; height:36px; font-size:.72rem; font-weight:700; cursor:pointer;
    font-family:'Karla',Arial,sans-serif;
  }
  .hero-content{ position:relative; z-index:1; margin-top:12px; }
  .toolbar-row{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .toolbar-row:first-child{ margin-top:0; }
  .toolbar-row-search{
    flex-direction:row; gap:8px; transition:gap .32s ease;
  }
  .toolbar-row-search select.filter-select{
    flex:1 1 0; min-width:0;
    transition:flex-grow .4s cubic-bezier(.4,0,.2,1), flex-basis .4s cubic-bezier(.4,0,.2,1), opacity .3s ease, margin-left .32s ease, padding .32s ease;
  }
  .toolbar-row-search input[type=text]{
    flex:1 1 0; min-width:0;
    transition:flex-grow .4s cubic-bezier(.4,0,.2,1), flex-basis .4s cubic-bezier(.4,0,.2,1);
  }
  .toolbar-row-search.search-expanded{ gap:0; }
  .toolbar-row-search.search-expanded input[type=text]{ flex:1 1 100%; }
  .toolbar-row-search.search-expanded select.filter-select{
    flex:0 0 0%; opacity:0; margin-left:0; padding-left:0; padding-right:0; pointer-events:none; overflow:hidden;
  }
  .toolbar-row input[type=text]{
    height:38px; padding:0 12px; border-radius:8px; border:none;
    font-family:'Karla',Arial,sans-serif;font-size:.85rem;background:rgba(247,241,228,0.96);
  }
  select.filter-select{
    height:38px; padding:0 10px; border-radius:8px; border:none;font-family:'Karla',Arial,sans-serif;
    font-size:.8rem;background:rgba(247,241,228,0.96);color:var(--deep-water);
  }
  .btn-add{
    background:var(--dawn-coral);color:white;border:none;border-radius:8px;
    height:38px; padding:0 16px;font-family:'Karla',Arial,sans-serif;font-weight:700;font-size:.83rem;cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .btn-add:hover{ background:#D96A4A; }
  .btn-add:active{transform:scale(.97);}
  .btn-report{
    border-radius:8px; height:38px; padding:0 14px; font-family:'Karla',Arial,sans-serif; font-weight:700;
    font-size:.8rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-report svg{ flex-shrink:0; }
  input:focus-visible, select:focus-visible, button:focus-visible{
    outline:2px solid var(--dawn-coral-dim); outline-offset:2px;
  }

    .app-header h1{ font-size:2.1rem; }
    .hero-content{ max-width:63%; margin-top:16px; }
    .toolbar-row{ flex-direction:row; align-items:center; margin-top:10px; }
    .toolbar-row-actions{ justify-content:flex-start; }
    .toolbar-row-actions button{ flex:0 0 auto; }
  }
  main{padding:14px;max-width:760px;margin:0 auto;}
  .empty-state{text-align:center;padding:60px 20px;color:#9c8f6c;font-family:'Karla',Arial,sans-serif;}
  .person-group{margin-bottom:18px;}
  .person-group-header{
    display:flex; justify-content:space-between; align-items:center; padding:11px 14px;
    border-radius:10px; cursor:pointer; font-family:'Karla',Arial,sans-serif; font-weight:700;
    font-size:.85rem; margin-bottom:10px; border:1px solid var(--line);
  }
  .person-group-header .group-chevron{ color:var(--dawn-coral); transition:transform .2s; }
  .person-group-header .group-chevron.open{ transform:rotate(90deg); }
  .person-group-header.g-investigador{ background:var(--sage-light); color:var(--sage); border-color:#c9dcc9; }
  .person-group-header.g-miembroNuevo{ background:var(--mist); color:var(--water-mid); border-color:#c3d8d6; }
  .person-group-header.g-menosActivo{ background:var(--rojo-light); color:var(--rojo); border-color:#e0bdae; }
  .empty-state .big{font-size:2rem;margin-bottom:8px;}
  .stats-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
  .stat-pill{
    font-family:'Karla',Arial,sans-serif;font-size:.68rem;background:white;border:1px solid var(--line);
    border-radius:20px;padding:6px 12px;white-space:nowrap;color:var(--water-mid);
  }
  .stat-pill b{color:var(--deep-water);}
  .privacy-note{
    background:var(--rojo-light);border:1px solid #e0bdae;border-radius:10px;
    padding:10px 12px;margin-bottom:14px;font-family:'Karla',Arial,sans-serif;
    font-size:.72rem;color:#7a3524;line-height:1.4;
  }
  .privacy-note b{color:var(--rojo);}
  .card{
    background:white;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;
    overflow:hidden;box-shadow:0 1px 3px rgba(14,59,67,0.08);
  }
  .card-head{padding:13px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
  .card-head-left{min-width:0;flex:1;}
  .card-name{font-size:1.02rem;font-weight:700;color:var(--deep-water);font-family:'Fraunces',Georgia,serif;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-meta{font-family:'Karla',Arial,sans-serif;font-size:.73rem;color:#9c8f6c;margin-top:2px;}
  .badge{
    font-family:'Karla',Arial,sans-serif;font-size:.63rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.03em;padding:4px 9px;border-radius:20px;white-space:nowrap;
  }
  .badge-investigador{background:var(--sage-light);color:var(--sage);}
  .badge-miembroNuevo{background:var(--mist);color:var(--water-mid);}
  .badge-menosActivo{background:var(--rojo-light);color:var(--rojo);}
  .alert-chip{
    background:var(--rojo-light); color:var(--rojo); font-family:'Karla',Arial,sans-serif;
    font-size:.62rem; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;
  }
  .alert-box{
    background:var(--rojo-light); border:1px solid #e0bdae; border-radius:8px; padding:9px 11px;
    margin-top:10px; font-family:'Karla',Arial,sans-serif; font-size:.78rem; color:#7a3524; line-height:1.65;
  }
  .stat-pill-alert{
    cursor:pointer; border-color:var(--rojo); color:var(--rojo); font-weight:700;
  }
  .stat-pill-alert b{ color:var(--rojo); }
  .progress-bar-mini{height:5px;background:var(--linen-dim);border-radius:4px;margin-top:8px;overflow:hidden;}
  .progress-bar-mini > div{height:100%;background:var(--living-teal);}
  .semaforo-mini{display:flex;gap:3px;margin-top:6px;}
  .semaforo-dot{width:8px;height:8px;border-radius:50%;background:#e2d8ba;}
  .semaforo-dot.verde{background:var(--sage);}
  .semaforo-dot.amarillo{background:var(--amber);}
  .semaforo-dot.rojo{background:var(--rojo);}
  .chevron{font-size:1.1rem;color:var(--dawn-coral);transition:transform .2s;flex-shrink:0;}
  .card.open .chevron{transform:rotate(90deg);}
  .card-body{display:none;padding:0 14px 16px;border-top:1px solid var(--line);}
  .card.open .card-body{display:block;}
  .field-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .field{flex:1;min-width:120px;}
  .field.full{flex:1 1 100%;}
  .field label{
    display:block;font-family:'Karla',Arial,sans-serif;font-size:.65rem;text-transform:uppercase;
    letter-spacing:.04em;color:#9c8f6c;margin-bottom:3px;
  }
  .field input, .field select, .field textarea{
    width:100%;padding:8px 9px;border-radius:7px;border:1px solid var(--line);
    font-family:'Karla',Arial,sans-serif;font-size:.86rem;background:var(--linen);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:44px;}
  .section-title{
    font-family:'Karla',Arial,sans-serif;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;
    color:var(--dawn-coral);font-weight:700;margin-top:18px;margin-bottom:6px;border-bottom:1px solid var(--line);
    padding-bottom:4px;
  }
  details.subsection{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--linen);}
  details.subsection summary{
    padding:10px 12px;cursor:pointer;font-family:'Karla',Arial,sans-serif;font-weight:700;
    font-size:.82rem;color:var(--water-mid);list-style:none;display:flex;justify-content:space-between;align-items:center;
    background:white;
  }
  details.subsection summary::-webkit-details-marker{display:none;}
  details.subsection summary .sum-arrow{color:var(--dawn-coral);transition:transform .2s;}
  details.subsection[open] summary .sum-arrow{transform:rotate(90deg);}
  details.subsection summary .sum-hint{font-weight:400;color:#a89e7f;font-size:.7rem;}
  .subsection-inner{padding:10px 12px 14px;}
  .check-grid{display:flex;flex-direction:column;gap:2px;}
  .check-item{
    display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line);
    font-family:'Karla',Arial,sans-serif;font-size:.85rem;
  }
  .check-item:last-child{border-bottom:none;}
  .check-item input[type=checkbox]{width:19px;height:19px;accent-color:var(--sage);flex-shrink:0;margin-top:1px;}
  .check-item.checked > span{color:var(--sage);font-weight:600;}
  .check-item span{flex:1;}
  .check-item input[type=date]{
    padding:5px 7px;border-radius:6px;border:1px solid var(--line);font-family:'Karla',Arial,sans-serif;
    font-size:.78rem;background:white;margin-left:6px;
  }
  .leccion-item{border-bottom:1px dashed var(--line);padding:9px 2px;}
  .leccion-item:last-child{border-bottom:none;}
  .leccion-top{display:flex;align-items:center;gap:8px;}
  .leccion-top input[type=checkbox]{width:19px;height:19px;accent-color:var(--sage);flex-shrink:0;}
  .leccion-top span{flex:1;font-family:'Karla',Arial,sans-serif;font-size:.85rem;}
  .leccion-top.checked span{color:var(--sage);font-weight:600;}
  .leccion-top input[type=date]{
    padding:5px 7px;border-radius:6px;border:1px solid var(--line);font-family:'Karla',Arial,sans-serif;
    font-size:.75rem;background:white;
  }
  .list-rows{display:flex;flex-direction:column;gap:8px;}
  .list-row{
    background:white;border-left:3px solid var(--dawn-coral);border-radius:4px;padding:8px 10px;
    font-family:'Karla',Arial,sans-serif;font-size:.83rem;
  }

function uid(){ return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(LANG==='en' ? 'en-US':'es-ES', {day:'numeric', month:'short', year:'numeric'});
}
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function daysAgo(iso){
  if(!iso) return 9999;
  const d1 = new Date(iso+'T00:00:00'), d2 = new Date(todayISO()+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function getAlerts(p){
  const alerts = [];
  const today = todayISO();
  const threshold = (settings && settings.alertDays) || 14;
  const inactivity = daysAgo(p.actualizado);
  if(inactivity >= threshold){
    alerts.push({key:'stalled', days:inactivity});
  }
  const compVencidos = (p.compromisos||[]).filter(c=> !c.cumplido && daysAgo(c.fecha) >= 7);
  if(compVencidos.length){
    alerts.push({key:'compromisos', count:compVencidos.length});
  }
  if(p.accionActual && p.accionActual.fecha && p.accionActual.fecha < today && p.accionActual.resultado === 'Pendiente'){
    alerts.push({key:'accion', fecha:p.accionActual.fecha});
  }
  return alerts;
}
function alertLabel(a){
  if(a.key==='stalled') return '⏱ ' + t('alertStalled').replace('{days}', a.days);
  if(a.key==='compromisos') return '📌 ' + t('alertCompromisos').replace('{count}', a.count);
  if(a.key==='accion') return '⚑ ' + t('alertAccion').replace('{date}', fmtDate(a.fecha));
  return '';
}

const OLD_ESTADO_MAP = {'Investigador':'investigador','Miembro Nuevo':'miembroNuevo','Menos Activo':'menosActivo'};
const OLD_SEXO_MAP = {'Hombre':'hombre','Mujer':'mujer','Niño':'nino','Niña':'nina'};

function inferViewMode(p){
  const fichaFilled = Object.values(p.ficha||{}).some(v=> v && String(v).trim());
  const semaforoFilled = Object.values(p.semaforo||{}).some(s=> s && (s.estado || (s.nota && s.nota.trim())));
  const domingoFilled = Object.values(p.domingo||{}).some(v=> v===true || (typeof v==='string' && v.trim()));
  const relacionesFilled = Object.values(p.relaciones||{}).some(v=> v===true || (typeof v==='string' && v.trim()));
  const checklistFilled = (p.checklistFinal||[]).some(c=>c.marcado);
  const posteriorFilled = (p.posterior||[]).some(c=>c.marcado);
  const escriturasFilled = (p.escrituras||[]).length>0;
  return (fichaFilled||semaforoFilled||domingoFilled||relacionesFilled||checklistFilled||posteriorFilled||escriturasFilled) ? 'completo' : 'rapido';
}

function normalizePerson(p){
  const d = defaultPerson();
  const out = Object.assign({}, d, p);
  if(OLD_ESTADO_MAP[out.estado]) out.estado = OLD_ESTADO_MAP[out.estado];
  if(OLD_SEXO_MAP[out.sexo]) out.sexo = OLD_SEXO_MAP[out.sexo];
  out.ficha = Object.assign({}, d.ficha, p.ficha||{});
  out.domingo = Object.assign({}, d.domingo, p.domingo||{});
  out.relaciones = Object.assign({}, d.relaciones, p.relaciones||{});
  out.accionActual = Object.assign({}, d.accionActual, p.accionActual||{});
  out.semaforo = {};
  DIMENSIONES.forEach(dim=>{
    out.semaforo[dim.key] = Object.assign({estado:'',nota:''}, (p.semaforo && p.semaforo[dim.key]) || {});
  });
  const oldProg = p.progreso || {};
  let lecciones;
  if(Array.isArray(oldProg.lecciones) && oldProg.lecciones.length && typeof oldProg.lecciones[0] === 'object'){
    lecciones = LECCIONES.map((t,i)=> oldProg.lecciones[i] ? {comprendida: !!oldProg.lecciones[i].comprendida, fecha: oldProg.lecciones[i].fecha||''} : {comprendida:false, fecha:''});
  } else if(Array.isArray(oldProg.lecciones)){
    lecciones = LECCIONES.map((t,i)=>({comprendida: !!oldProg.lecciones[i], fecha:''}));
  } else {
    lecciones = d.progreso.lecciones;
  }
  out.progreso = Object.assign({}, d.progreso, oldProg, {lecciones});
  out.compromisos = p.compromisos || [];
  out.escrituras = p.escrituras || [];
  out.checklistFinal = (p.checklistFinal && p.checklistFinal.length === CHECKLIST_FINAL.length) ? p.checklistFinal : d.checklistFinal;
  out.posterior = (p.posterior && p.posterior.length === POSTERIOR.length) ? p.posterior : d.posterior;
  out.notas = p.notas || [];
  out.viewMode = p.viewMode || inferViewMode(out);
  return out;
}

/* Storage: use the native Claude artifact bridge when present (in-app preview),
   otherwise fall back to localStorage so the file also works standalone
   when downloaded and opened directly in a browser. */
const hasNativeStorage = !!(window.storage && typeof window.storage.get === 'function');
const storageAPI = hasNativeStorage ? window.storage : {
  async get(key){
    try{
      const v = localStorage.getItem(key);
      return v !== null ? {key, value:v} : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return {key, value};
  },
  async delete(key){
    localStorage.removeItem(key);
    return {key, deleted:true};
  },
  async list(prefix){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!prefix || (k && k.startsWith(prefix))) keys.push(k);
    }
    return {keys, prefix};
  }
};

async function loadAll(){
  try{
    const res = await storageAPI.get('gather-personas', false);
    const raw = res && res.value ? JSON.parse(res.value) : [];
    people = raw.map(normalizePerson);
  }catch(e){ people = []; }
  try{
    const res2 = await storageAPI.get('gather-settings', false);
    settings = res2 && res2.value ? Object.assign(defaultSettings(), JSON.parse(res2.value)) : defaultSettings();
  }catch(e){ settings = defaultSettings(); }
  try{
    const res3 = await storageAPI.get('gather-lang', false);
    if(res3 && res3.value){ LANG = res3.value; }
  }catch(e){}
  try{
    const res4 = await storageAPI.get('gather-trash', false);
    trash = res4 && res4.value ? JSON.parse(res4.value) : [];
    const before = trash.length;
    trash = trash.filter(t2 => daysAgo(t2.deletedAt) < 30);
    if(trash.length !== before){ saveTrash(); }
  }catch(e){ trash = []; }
  applyStaticText();
  updateTrashButton();
  render();
}

function orgSubtitle(){
  const wt = UNIT_TYPES.find(u=>u.code===settings.wardType);
  const at = AREA_TYPES.find(a=>a.code===settings.stakeType);
  const parts = [];
  if(settings.wardName) parts.push(`${wt[LANG]} ${settings.wardName}`);
  if(settings.stakeName) parts.push(`${at[LANG]} ${settings.stakeName}`);
  return parts.length ? parts.join(' · ') : t('appSubDefault');
}
function renderMissionaryList(){
  const el = document.getElementById('missionaryList');
  el.innerHTML = (settings.missionaries||[]).map((m,i)=>`
    <div class="missionary-row">
      <input type="text" data-mrow="nombre" data-idx="${i}" value="${escapeHtml(m.nombre)}" placeholder="${t('missionaryNamePh')}">
      <input type="text" data-mrow="area" data-idx="${i}" value="${escapeHtml(m.area)}" placeholder="${t('missionaryAreaPh')}">
      <span class="row-del" data-delmissionary="${i}">✕</span>
    </div>
  `).join('');
  el.querySelectorAll('[data-mrow]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const idx = parseInt(inp.getAttribute('data-idx'),10);
      const key = inp.getAttribute('data-mrow');
      settings.missionaries[idx][key] = inp.value;
    });
  });
  el.querySelectorAll('[data-delmissionary]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.getAttribute('data-delmissionary'),10);
      settings.missionaries.splice(idx,1);
      renderMissionaryList();
    });
  });
}

/* ============ SCORING / BADGES ============ */
function progresoScore(p){
  const total = p.progreso.lecciones.length + 3;
  let done = p.progreso.lecciones.filter(l=>l.comprendida).length;
  if(p.progreso.asiste) done++;
  if(p.progreso.lee) done++;
  if(p.progreso.acepta) done++;
  return Math.round((done/total)*100);
}
function semaforoDots(p){
  return DIMENSIONES.map(d=>{
    const est = (p.semaforo[d.key].estado||'').toLowerCase();
    return `<div class="semaforo-dot ${est}"></div>`;
  }).join('');
}

/* ============ RENDER ============ */
function renderStats(){
  const el = document.getElementById('statsRow');
  const total = people.length;
  const inv = people.filter(p=>p.estado==='investigador').length;
  const nuevo = people.filter(p=>p.estado==='miembroNuevo').length;
  const bautismos = people.filter(p=>p.progreso.bautismoFijado).length;
  const rojos = people.filter(p=> DIMENSIONES.some(d=> (p.semaforo[d.key].estado||'')==='rojo')).length;
  const conAlerta = people.filter(p=> getAlerts(p).length>0).length;
  el.innerHTML = `
    <div class="stat-pill"><b>${total}</b> ${t('statTotal')}</div>
    <div class="stat-pill"><b>${inv}</b> ${t('statInvestigadores')}</div>
    <div class="stat-pill"><b>${nuevo}</b> ${t('statMiembrosNuevos')}</div>
    <div class="stat-pill"><b>${bautismos}</b> ${t('statFechaFijada')}</div>
    <div class="stat-pill"><b>${rojos}</b> ${t('statAlertaRoja')}</div>
    <div class="stat-pill stat-pill-alert" id="statAlertPill"><b>${conAlerta}</b> ${t('statAlerta')}</div>
  `;
  const pill = document.getElementById('statAlertPill');
  if(pill){
    pill.addEventListener('click', ()=>{
      document.getElementById('filterEstado').value = 'alertas';
      render();
    });
  }
}

function render(){
  captureOpenSections();
  renderStats();
  const container = document.getElementById('listContainer');
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const filter = document.getElementById('filterEstado').value;
  let filtered = people.filter(p=>{
    const haystack = [p.nombre, p.misioneros, p.lugar].filter(Boolean).join(' ').toLowerCase();
    const matchesSearch = !search || haystack.includes(search);
    const matchesFilter = filter === 'alertas' ? getAlerts(p).length>0 : (filter === 'todos' || p.estado === filter);
    return matchesSearch && matchesFilter;
  });
  if(filter === 'alertas'){
    filtered.sort((a,b)=> (a.actualizado||'').localeCompare(b.actualizado||''));
  } else {
    filtered.sort((a,b)=> (b.actualizado||'').localeCompare(a.actualizado||''));
  }

  if(filtered.length === 0){
    container.innerHTML = `<div class="empty-state"><div class="big">〜</div>${people.length===0 ? t('emptyNoPeople') : t('emptyNoResults')}</div>`;
    return;
  }

  if(filter === 'todos'){
    const groups = ESTADOS.map(e=>({
      code:e.code, label:e[LANG], items: filtered.filter(p=>p.estado===e.code)
    })).filter(g=>g.items.length>0);
    container.innerHTML = groups.map(g=>{
      const isOpen = groupOpen[g.code] !== false;
      return `
      <div class="person-group">
        <div class="person-group-header g-${g.code}" data-grouptoggle="${g.code}">
          <span>${g.label} (${g.items.length})</span>
          <span class="group-chevron ${isOpen?'open':''}">›</span>
        </div>
        <div class="person-group-body" style="display:${isOpen?'block':'none'}">
          ${g.items.map(renderCard).join('')}
        </div>
      </div>`;
    }).join('');
  } else {
    container.innerHTML = filtered.map(renderCard).join('');
  }
  attachListeners();
}

function checkItem(label, checked, dataAttrs){
  return `<label class="check-item ${checked?'checked':''}"><input type="checkbox" ${dataAttrs} ${checked?'checked':''}><span>${label}</span></label>`;

function setPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}

function patchCardHeader(person){
  const card = document.querySelector(`.card[data-id="${person.id}"]`);
  if(!card) return;
  const nameEl = card.querySelector('.card-name');
  if(nameEl) nameEl.textContent = person.nombre || t('newPersonName');
  const sexoObj = SEXOS.find(s=>s.code===person.sexo) || SEXOS[0];
  const metaEl = card.querySelector('.card-meta');
  if(metaEl){
    metaEl.textContent = `${sexoObj[LANG]}${person.edad ? ' · '+person.edad : ''}${person.lugar ? ' · '+person.lugar : ''}${person.ficha.telefono ? ' · 📞 '+person.ficha.telefono : ''}`;
  }
  const badgeEl = card.querySelector('.badge');
  if(badgeEl){
    const estadoObj = ESTADOS.find(e=>e.code===person.estado) || ESTADOS[0];
    badgeEl.className = `badge badge-${person.estado}`;
    badgeEl.textContent = estadoObj[LANG];
  }
  const scoreBar = card.querySelector('.progress-bar-mini > div');
  if(scoreBar){ scoreBar.style.width = progresoScore(person) + '%'; }

  const alerts = getAlerts(person);
  const headRight = card.querySelector('.card-head > div:nth-child(2)');
  let chipEl = card.querySelector('.alert-chip');
  if(alerts.length){
    const chipHtml = `⚠ ${alerts.length}`;
    const chipTitle = alerts.map(alertLabel).join(' · ');
    if(chipEl){
      chipEl.textContent = chipHtml; chipEl.title = chipTitle;
    } else if(headRight){
      const span = document.createElement('span');
      span.className = 'alert-chip';
      span.textContent = chipHtml; span.title = chipTitle;
      headRight.appendChild(span);
    }
  } else if(chipEl){
    chipEl.remove();
  }
  let boxEl = card.querySelector('.card-body > .alert-box');
  const cardBody = card.querySelector('.card-body');
  if(alerts.length){
    const boxHtml = alerts.map(alertLabel).join('<br>');
    if(boxEl){ boxEl.innerHTML = boxHtml; }
    else if(cardBody){
      const div = document.createElement('div');
      div.className = 'alert-box';
      div.innerHTML = boxHtml;
      cardBody.insertBefore(div, cardBody.firstChild);
    }
  } else if(boxEl){
    boxEl.remove();
  }
}

function updateTrashButton(){
  const btn = document.getElementById('btnTrash');
  if(!btn) return;
  const existing = btn.querySelector('.icon-btn-badge');
  if(existing) existing.remove();
  if(trash.length > 0){
    const badge = document.createElement('span');
    badge.className = 'icon-btn-badge';
    badge.textContent = trash.length > 99 ? '99+' : trash.length;
    btn.appendChild(badge);
  }
}
function renderTrashList(){
  document.getElementById('trashTitle').textContent = t('trashTitle');
  document.getElementById('btnTrashClose').textContent = t('close');
  const el = document.getElementById('trashList');
  if(trash.length === 0){
    el.innerHTML = `<div class="report-empty">${t('trashEmpty')}</div>`;
    return;
  }
  el.innerHTML = trash.map(tp=>`
    <div class="trash-row" data-trashid="${tp.id}">
      <div class="tr-name">${escapeHtml(tp.nombre) || t('newPersonName')}</div>
      <div class="tr-date">${t('trashDeletedOn')} ${fmtDate(tp.deletedAt)}</div>
      <div class="tr-actions">
        <button class="btn-restore" data-restore="${tp.id}">${t('trashRestore')}</button>
        <button class="btn-perm" data-permdelete="${tp.id}">${t('trashPermDelete')}</button>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('[data-restore]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-restore');
      const idx = trash.findIndex(x=>x.id===id);
      if(idx === -1) return;
      const [restored] = trash.splice(idx,1);
      delete restored.deletedAt;
      people.unshift(normalizePerson(restored));
      await savePeople(); await saveTrash();
      renderTrashList(); updateTrashButton(); render();
      showToast(t('toastRestored'));
    });
  });
  el.querySelectorAll('[data-permdelete]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-permdelete');
      const tp = trash.find(x=>x.id===id);
      if(!tp) return;
      const msg = t('trashConfirmPerm').replace('{name}', tp.nombre || (LANG==='en'?'this person':'esta persona'));
      if(confirm(msg)){
        trash = trash.filter(x=>x.id!==id);
        await saveTrash();
        renderTrashList(); updateTrashButton();
        showToast(t('toastPermDeleted'));
      }
    });
  });
}

  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = todayISO();
  a.href = url;
  a.download = `gather-respaldo-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

});

document.getElementById('fileImportBackup').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (evt)=>{
    try{
      const data = JSON.parse(evt.target.result);
      if(!data || data.app !== 'gather' || !Array.isArray(data.people)){
        showToast(t('toastImportError'));
        return;
      }
      const msg = t('confirmImport').replace('{count}', people.length).replace('{newCount}', data.people.length);
      if(confirm(msg)){
        people = data.people.map(normalizePerson);
        if(data.settings){ settings = Object.assign(defaultSettings(), data.settings); }
        if(Array.isArray(data.trash)){ trash = data.trash; }
        await savePeople(); await saveSettingsData(); await saveTrash();
        applyStaticText(); updateTrashButton(); render();
        showToast(t('toastImported'));
      }
    }catch(err){
      showToast(t('toastImportError'));
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

function reportPersonBlock(p){
  const alerts = getAlerts(p);
  const lecc = p.progreso.lecciones.filter(l=>l.comprendida).length;
  const compPend = (p.compromisos||[]).filter(c=>!c.cumplido);
  const suggestedOwner = p.accionActual.responsable || p.relaciones.miembroAmigoAsignado || p.misioneros || '';

  let html = `<div class="report-person-block">`;
  html += `<div class="rp-name">${escapeHtml(p.nombre) || '—'}</div>`;
  const metaBits = [];
  if(p.lugar) metaBits.push(escapeHtml(p.lugar));
  if(p.misioneros) metaBits.push(t('labelMisioneros')+': '+escapeHtml(p.misioneros));
  if(metaBits.length) html += `<div class="rp-meta">${metaBits.join(' · ')}</div>`;

  html += `<div class="rp-row">${t('reportLessonsProgress')}: ${lecc}/${LECCIONES.length}</div>`;

  if(alerts.length){
    html += `<div class="rp-alerts">${alerts.map(alertLabel).join('<br>')}</div>`;
  }
  if(p.condicion){
    html += `<div class="rp-row"><b>${t('reportBarrera')}:</b> ${escapeHtml(p.condicion)}</div>`;
  }
  if(p.accionActual.necesidad || p.accionActual.accion){
    html += `<div class="rp-action-box">`;
    if(p.accionActual.necesidad) html += `<div><b>${t('accNecesidad')}:</b> ${escapeHtml(p.accionActual.necesidad)}</div>`;
    if(p.accionActual.accion) html += `<div><b>${t('accAccion')}:</b> ${escapeHtml(p.accionActual.accion)}</div>`;
    if(suggestedOwner) html += `<div><b>${t('reportSuggestedOwner')}:</b> ${escapeHtml(suggestedOwner)}</div>`;
    if(p.accionActual.fecha) html += `<div><b>${t('accFecha')}:</b> ${fmtDate(p.accionActual.fecha)}</div>`;
    html += `</div>`;
  } else {
    html += `<div class="rp-hint">${t('reportNoActionHint')}</div>`;
  }
  if(compPend.length){
    html += `<div class="rp-row"><b>${t('reportCompPend')}:</b> ${compPend.map(c=>escapeHtml(c.texto)).join('; ')}</div>`;
  }
  html += `</div>`;
  return html;
}

/* ============ VOICE DICTATION ============ */
let activeRecognition = null;
let activeRecognitionId = null;
function startVoiceDictation(personId, btnEl){
  const textarea = document.querySelector(`[data-newnote="${personId}"]`);
  if(!textarea) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    showToast(t('toastVoiceUnsupported'));
    return;
  }
  if(activeRecognitionId === personId){
    if(activeRecognition){ activeRecognition.stop(); }
    return;
  }
  if(activeRecognition){ activeRecognition.stop(); }
  const r = new SR();
  r.lang = LANG === 'en' ? 'en-US' : 'es-MX';
  r.interimResults = false;
  r.continuous = false;
  r.maxAlternatives = 1;
  activeRecognitionId = personId;
  btnEl.classList.add('mic-active');
  showToast(t('toastVoiceListening'));
  r.onresult = (evt)=>{
    let text = '';
    for(let i=0;i<evt.results.length;i++){ text += evt.results[i][0].transcript; }
    textarea.value = (textarea.value ? textarea.value.trim() + ' ' : '') + text.trim();
  };
  r.onerror = ()=>{
    showToast(t('toastVoiceError'));
  };
  r.onend = ()=>{
    activeRecognitionId = null;
    activeRecognition = null;
    btnEl.classList.remove('mic-active');
  };
  activeRecognition = r;
  try{ r.start(); }
  catch(err){
    showToast(t('toastVoiceError'));
    btnEl.classList.remove('mic-active');
    activeRecognitionId = null;
  }
}

/* ============ AGENDA: NEXT 7 DAYS ============ */
function buildAgenda(){
  const today = todayISO();
  const in7date = new Date(); in7date.setDate(in7date.getDate()+7);
  const in7 = in7date.toISOString().slice(0,10);

  const bautismosProx = people.filter(p=> p.progreso.bautismoFijado && p.progreso.fechaBautismo && p.progreso.fechaBautismo >= today && p.progreso.fechaBautismo <= in7)
    .sort((a,b)=> a.progreso.fechaBautismo.localeCompare(b.progreso.fechaBautismo));

  const accionesRelevantes = people.filter(p=> p.accionActual && p.accionActual.fecha && p.accionActual.resultado === 'Pendiente' && p.accionActual.fecha <= in7)
    .sort((a,b)=> a.accionActual.fecha.localeCompare(b.accionActual.fecha));

  const compromisosVencidos = people.filter(p=> (p.compromisos||[]).some(c=> !c.cumplido && daysAgo(c.fecha) >= 7));

  return `
    <h1>Gather — ${t('btnAgenda')}</h1>
    <div class="report-sub">${t('reportGenerated')} ${fmtDate(today)}</div>

    <h2>🎉 ${t('agendaBaptisms')}</h2>
    ${bautismosProx.length ? bautismosProx.map(p=>`
      <div class="report-person-block agenda-clickable" data-openperson="${p.id}">
        <div class="rp-name">${escapeHtml(p.nombre)}</div>
        <div class="rp-row">${t('fechaBautismoLabel')} ${fmtDate(p.progreso.fechaBautismo)}</div>
      </div>`).join('') : `<div class="report-empty">${t('reportEmpty')}</div>`}

    <h2>⚑ ${t('agendaActions')}</h2>
    ${accionesRelevantes.length ? accionesRelevantes.map(p=>{
      const overdue = p.accionActual.fecha < today;
      return `<div class="report-person-block agenda-clickable" data-openperson="${p.id}">
        <div class="rp-name">${escapeHtml(p.nombre)}</div>
        <div class="rp-row">${escapeHtml(p.accionActual.accion || p.accionActual.necesidad)}</div>
        <div class="rp-row"><b>${overdue?t('agendaOverdue'):t('accFecha')}:</b> ${fmtDate(p.accionActual.fecha)}${p.accionActual.responsable ? ' · '+t('accResponsable')+': '+escapeHtml(p.accionActual.responsable) : ''}</div>
      </div>`;
    }).join('') : `<div class="report-empty">${t('reportEmpty')}</div>`}

    <h2>📌 ${t('agendaCommitments')}</h2>
    ${compromisosVencidos.length ? compromisosVencidos.map(p=>{
      const pend = p.compromisos.filter(c=> !c.cumplido && daysAgo(c.fecha) >= 7);
      return `<div class="report-person-block agenda-clickable" data-openperson="${p.id}">
        <div class="rp-name">${escapeHtml(p.nombre)}</div>
        <div class="rp-row">${pend.map(c=>escapeHtml(c.texto)).join('; ')}</div>
      </div>`;
    }).join('') : `<div class="report-empty">${t('reportEmpty')}</div>`}
  `;
}
function openAgenda(){
  document.getElementById('reportContent').innerHTML = buildAgenda();
  document.getElementById('reportToolbarTitle').textContent = t('btnAgenda');
  document.getElementById('reportOverlay').classList.add('open');
  document.querySelectorAll('[data-openperson]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-openperson');
      document.getElementById('reportOverlay').classList.remove('open');
      document.getElementById('filterEstado').value = 'todos';
      openCardId = id;
      render();
      document.querySelector(`.card[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}
